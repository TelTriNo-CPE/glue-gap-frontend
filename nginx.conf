worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Support for large file uploads
    client_max_body_size 2000M;

    # Timeouts to prevent dropping connections during large uploads/processing
    proxy_read_timeout 3600s;
    proxy_connect_timeout 3600s;
    proxy_send_timeout 3600s;
    
    # [Added] รอรับข้อมูลจากเบราว์เซอร์ให้ถึง 1 ชั่วโมง (ป้องกันเน็ตกระตุกแล้วหลุด)
    send_timeout 3600s;
    client_body_timeout 3600s;
    client_header_timeout 3600s;
    keepalive_timeout 3600s;

    server {
        listen 80;
        server_name localhost;

        # Frontend static files
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # ─── Image Processor (tiles, analysis, export generation) ────
        # DZI tiles and source images — must go to image-processor, not backend
        location /tiles {
            proxy_pass http://image-processor:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # Gap analysis
        location /analyze-gaps {
            proxy_pass http://image-processor:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        # Export generation (POST endpoints) — image-processor creates the files
        location = /exports/image {
            proxy_pass http://image-processor:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        location = /exports/excel {
            proxy_pass http://image-processor:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        # ─── API Gateway (uploads, results, presigned export URLs) ─────
        location ~ ^/(upload|results|exports) {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Stream ทะลุไปหา Backend ตรงๆ (สำหรับ upload ไฟล์ใหญ่)
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # Custom error page
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}